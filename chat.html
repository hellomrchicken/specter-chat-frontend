<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>
<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
}
#servers { width:80px; background:#111; padding:10px; }
#channels { width:220px; background:#2b2d31; padding:10px; }
#chat { flex:1; display:flex; flex-direction:column; }
#messages { flex:1; overflow-y:auto; padding:10px; }
#inputArea { display:flex; padding:10px; }
#msg { flex:1; padding:10px; }
</style>
</head>

<body>

<div id="servers">
  <div onclick="openDMs()">DM</div>
  <div onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="title">Select a chat</div>
  <div id="messages"></div>
  <div id="inputArea">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

const panelList = document.getElementById("panelList");
const searchUser = document.getElementById("searchUser");
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");
const groupList = document.getElementById("groupList");

let allUsers = [];
let currentDM = null;
let currentGroup = null;

// ENTER SEND
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

// USERS
async function loadUsers() {
  const res = await fetch(API + "/users");
  const data = await res.json();
  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUsers(allUsers);
}

function renderUsers(list) {
  panelList.innerHTML = list.map(u =>
    `<div onclick="openDM('${u}')">${u}</div>`
  ).join("");
}

// DM
function openDM(u) {
  currentDM = u;
  currentGroup = null;
  loadMessages();
}

function openDMs() {
  loadUsers();
}

// GROUP
async function createGroup() {
  const name = prompt("Group name?");
  if (!name) return;

  await fetch(API + "/group/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user })
  });

  loadGroups();
}

async function loadGroups() {
  const res = await fetch(API + "/group/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ user })
  });

  const groups = await res.json();

  groupList.innerHTML = groups.map(g =>
    `<div onclick="openGroup('${g.name}')">${g.name}</div>`
  ).join("");
}

function openGroup(name) {
  currentGroup = name;
  currentDM = null;
  loadMessages();
}

// SEND
async function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  if (currentDM) {
    await fetch(API + "/dm/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ from:user, to:currentDM, text })
    });
  }

  if (currentGroup) {
    await fetch(API + "/group/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup, user, text })
    });
  }

  msgInput.value = "";
  loadMessages();
}

// LOAD
async function loadMessages() {
  if (currentDM) {
    const res = await fetch(API + "/dm/get", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username:user })
    });

    const dms = await res.json();

    messages.innerHTML = dms
      .filter(m =>
        (m.from === user && m.to === currentDM) ||
        (m.from === currentDM && m.to === user)
      )
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }

  if (currentGroup) {
    const res = await fetch(API + "/group/getMessages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup })
    });

    const msgs = await res.json();

    messages.innerHTML = msgs
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }
}

// INIT
setInterval(loadMessages, 2000);
loadUsers();
loadGroups();
</script>

</body>
</html>
