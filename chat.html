<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; background:#1e1f22; color:white; }

#servers { width:80px; background:#111214; padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px; }

.btn { width:55px; height:55px; background:#2b2d31; border-radius:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.btn:hover { background:#5865f2; }

#channels { width:220px; background:#2b2d31; padding:10px; display:flex; flex-direction:column; }

#searchUser {
  height:26px; padding:4px 8px; margin-bottom:10px;
  background:#1e1f22; color:white; border:none; border-radius:4px; font-size:11px;
}

.item { padding:6px; cursor:pointer; border-radius:5px; }
.item:hover { background:#404249; }

#chat { flex:1; display:flex; flex-direction:column; }

#topBar { padding:10px; background:#2b2d31; display:flex; justify-content:space-between; }

#messages { flex:1; overflow-y:auto; padding:10px; }

#inputArea { display:flex; padding:10px; background:#2b2d31; }

input { flex:1; padding:10px; border:none; background:#1e1f22; color:white; border-radius:6px; }

button { margin-left:10px; padding:10px; background:#5865f2; border:none; border-radius:6px; color:white; cursor:pointer; }
</style>
</head>

<body>

<div id="servers">
  <div class="btn" onclick="openDMs()">DM</div>
  <div class="btn" onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search users..." oninput="filterUsers()">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="topBar">
    <div id="title">Select a chat</div>
    <button onclick="send()">Send</button>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg" placeholder="Message...">
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

let allUsers = [];
let currentDM = null;
let currentGroup = null;

const messages = document.getElementById("messages");
const title = document.getElementById("title");

// SECRET
function handleSecrets(text) {
  if (text.toLowerCase() === "!spyglass") return "PARROT... I AM WIFES";
  return text;
}

// ENTER TO SEND
msg.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

// USERS
async function loadUsers() {
  const res = await fetch(API + "/users");
  const data = await res.json();
  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUsers(allUsers);
}

function renderUsers(list) {
  panelList.innerHTML = list.map(u =>
    `<div class="item" onclick="openDM('${u}')">${u}</div>`
  ).join("");
}

function filterUsers() {
  const q = searchUser.value.toLowerCase();
  renderUsers(allUsers.filter(u => u.includes(q)));
}

// DM
function openDM(u) {
  currentDM = u;
  currentGroup = null;
  title.innerText = "DM: " + u;
}

// GROUPS
async function createGroup() {
  const name = prompt("Group name?");
  const password = prompt("Password?");

  await fetch(API + "/group/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user, password })
  });

  loadGroups();
}

async function loadGroups() {
  const res = await fetch(API + "/group/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ user })
  });

  const groups = await res.json();

  groupList.innerHTML = groups.map(g =>
    `<div class="btn" onclick="openGroup('${g.name}')">${g.name[0]}</div>`
  ).join("");
}

async function openGroup(name) {
  const password = prompt("Password?");
  const res = await fetch(API + "/group/join", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user, password })
  });

  const data = await res.json();
  if (!data.ok) return alert(data.error);

  currentGroup = name;
  currentDM = null;
  title.innerText = "Group: " + name;
}

// SEND
async function send() {
  const raw = msg.value.trim();
  if (!raw) return;

  const text = handleSecrets(raw);

  if (currentDM) {
    await fetch(API + "/dm/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ from:user, to:currentDM, text })
    });
  }

  if (currentGroup) {
    await fetch(API + "/group/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup, user, text })
    });
  }

  msg.value = "";
}

// LOAD MESSAGES
async function loadMessages() {
  if (currentDM) {
    const res = await fetch(API + "/dm/get", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username:user })
    });

    const dms = await res.json();

    messages.innerHTML = dms
      .filter(m =>
        (m.from===user && m.to===currentDM) ||
        (m.from===currentDM && m.to===user)
      )
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`).join("");
  }

  if (currentGroup) {
    const res = await fetch(API + "/group/getMessages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup })
    });

    const msgs = await res.json();

    messages.innerHTML = msgs.map(m =>
      `<p><b>${m.from}:</b> ${m.text}</p>`
    ).join("");
  }

  messages.scrollTop = messages.scrollHeight;
}

// INIT
setInterval(loadMessages, 2000);
loadUsers();
loadGroups();
</script>

</body>
</html>
