<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
}

/* clickable fix */
#servers div,
#panelList div,
#groupList div,
button {
  cursor: pointer;
}

#servers {
  width:80px;
  background:#111;
  padding:10px;
}

#channels {
  width:220px;
  background:#2b2d31;
  padding:10px;
}

#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#inputArea {
  display:flex;
  padding:10px;
}

#msg {
  flex:1;
  padding:10px;
}
</style>
</head>

<body>

<div id="servers">
  <div onclick="openDMs()">DM</div>
  <div onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="title">Select a chat</div>
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

const panelList = document.getElementById("panelList");
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");
const groupList = document.getElementById("groupList");

let currentDM = null;
let currentGroup = null;

async function safeFetch(url, options) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();

    try {
      return JSON.parse(text);
    } catch {
      console.log("BAD RESPONSE:", text);
      return null;
    }
  } catch (e) {
    console.log("NETWORK ERROR:", e);
    return null;
  }
}

/* FIX: missing function */
function openDMs() {
  currentDM = null;
  currentGroup = null;
  document.getElementById("title").innerText = "DMs";
  loadUsers();
}

async function loadUsers() {
  const data = await safeFetch(API + "/users");
  if (!data) return;

  panelList.innerHTML = data
    .map(u => `<div onclick="openDM('${u.username}')">${u.username}</div>`)
    .join("");
}

function openDM(u) {
  currentDM = u;
  currentGroup = null;
  document.getElementById("title").innerText = "DM: " + u;
  loadMessages();
}

async function createGroup() {
  const name = prompt("Group name?");
  if (!name) return;

  await safeFetch(API + "/group/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user })
  });

  loadGroups();
}

async function loadGroups() {
  const groups = await safeFetch(API + "/group/get");
  if (!groups) return;

  groupList.innerHTML = groups
    .map(g => `<div onclick="openGroup('${g.name}')">${g.name}</div>`)
    .join("");
}

function openGroup(name) {
  currentGroup = name;
  currentDM = null;
  document.getElementById("title").innerText = "Group: " + name;
  loadMessages();
}

async function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  if (currentDM) {
    await safeFetch(API + "/dm/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ from:user, to:currentDM, text })
    });
  }

  if (currentGroup) {
    await safeFetch(API + "/group/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup, user, text })
    });
  }

  msgInput.value = "";
  loadMessages();
}

async function loadMessages() {
  if (currentDM) {
    const dms = await safeFetch(API + "/dm/get");
    if (!dms) return;

    messages.innerHTML = dms
      .filter(m =>
        (m.from === user && m.to === currentDM) ||
        (m.from === currentDM && m.to === user)
      )
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }

  if (currentGroup) {
    const msgs = await safeFetch(API + "/group/getMessages");
    if (!msgs) return;

    messages.innerHTML = msgs
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }
}

setInterval(loadMessages, 3000);
loadUsers();
loadGroups();
</script>

</body>
</html>
