<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
  overflow:hidden;
}

/* LEFT SERVER BAR */
#servers {
  width:80px;
  background:#111;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
  overflow-y:auto;
}

#servers div {
  width:55px;
  height:55px;
  background:#2b2d31;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
}

#servers div:hover {
  background:#5865f2;
}

/* USERS */
#channels {
  width:220px;
  background:#2b2d31;
  padding:10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#searchUser {
  padding:8px;
  margin-bottom:10px;
  background:#1e1f22;
  border:none;
  color:white;
  outline:none;
  border-radius:5px;
}

#panelList {
  overflow-y:auto;
  flex:1;
}

#panelList div {
  padding:8px;
  margin-bottom:5px;
  background:#1e1f22;
  border-radius:5px;
  cursor:pointer;
}

#panelList div:hover {
  background:#404249;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#title {
  padding:10px;
  background:#2b2d31;
  border-bottom:1px solid #111;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#messages p {
  margin:5px 0;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:10px;
  background:#2b2d31;
}

#msg {
  flex:1;
  padding:10px;
  border:none;
  outline:none;
  background:#1e1f22;
  color:white;
  border-radius:6px;
}

button {
  margin-left:10px;
  padding:10px 15px;
  background:#5865f2;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover {
  background:#4752c4;
}
</style>
</head>

<body>

<div id="servers">
  <div onclick="openDMs()">DM</div>
  <div onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="title">Select a chat</div>
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

const panelList = document.getElementById("panelList");
const searchUser = document.getElementById("searchUser");
const messages = document.getElementById("messages");
const msgInput = document.getElementById("msg");
const groupList = document.getElementById("groupList");

let allUsers = [];
let currentDM = null;
let currentGroup = null;

// SAFE FETCH (prevents crash)
async function safeFetch(url, options) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();

    try {
      return JSON.parse(text);
    } catch {
      console.log("NON JSON:", text);
      return null;
    }
  } catch (e) {
    console.log("FETCH ERROR:", e);
    return null;
  }
}

// ENTER SEND
msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

// USERS
async function loadUsers() {
  const data = await safeFetch(API + "/users");
  if (!data) return;

  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUsers(allUsers);
}

function renderUsers(list) {
  panelList.innerHTML = list.map(u =>
    `<div onclick="openDM('${u}')">${u}</div>`
  ).join("");
}

// DM
function openDM(u) {
  currentDM = u;
  currentGroup = null;
  document.getElementById("title").innerText = "DM: " + u;
  loadMessages();
}

function openDMs() {
  loadUsers();
}

// GROUP
async function createGroup() {
  const name = prompt("Group name?");
  if (!name) return;

  await safeFetch(API + "/group/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user })
  });

  loadGroups();
}

async function loadGroups() {
  const groups = await safeFetch(API + "/group/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ user })
  });

  if (!groups) return;

  groupList.innerHTML = groups.map(g =>
    `<div onclick="openGroup('${g.name}')">${g.name}</div>`
  ).join("");
}

function openGroup(name) {
  currentGroup = name;
  currentDM = null;
  document.getElementById("title").innerText = "Group: " + name;
  loadMessages();
}

// SEND
async function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  if (currentDM) {
    await safeFetch(API + "/dm/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ from:user, to:currentDM, text })
    });
  }

  if (currentGroup) {
    await safeFetch(API + "/group/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup, user, text })
    });
  }

  msgInput.value = "";
  loadMessages();
}

// LOAD MESSAGES
async function loadMessages() {
  if (currentDM) {
    const dms = await safeFetch(API + "/dm/get", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username:user })
    });

    if (!dms) return;

    messages.innerHTML = dms
      .filter(m =>
        (m.from === user && m.to === currentDM) ||
        (m.from === currentDM && m.to === user)
      )
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }

  if (currentGroup) {
    const msgs = await safeFetch(API + "/group/getMessages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group: currentGroup })
    });

    if (!msgs) return;

    messages.innerHTML = msgs
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }
}

// INIT
setInterval(loadMessages, 2000);
loadUsers();
loadGroups();
</script>

</body>
</html>
