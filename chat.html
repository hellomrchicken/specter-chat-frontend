<!DOCTYPE html>
<html>
<head>
  <title>Specter Chat</title>

  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    /* SERVERS */
    #servers {
      width: 70px;
      background: #0a0a0a;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .server {
      width: 50px;
      height: 50px;
      background: #222;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .server:hover {
      background: #444;
    }

    #addServer {
      background: #2ecc71;
    }

    /* CHANNELS */
    #channels {
      width: 220px;
      background: #1a1a1a;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .channel {
      padding: 6px;
      cursor: pointer;
      border-radius: 5px;
    }

    .channel:hover {
      background: #333;
    }

    #addChannel {
      margin-top: 10px;
      background: #2ecc71;
      padding: 6px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    /* CHAT */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chatHeader {
      padding: 10px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    #messages p {
      margin: 5px 0;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #1a1a1a;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: #111;
      color: white;
    }

    button {
      padding: 10px 15px;
      background: #2ecc71;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #27ae60;
    }
  </style>
</head>

<body>

<!-- SERVERS -->
<div id="servers">
  <div id="serverList"></div>
  <div id="addServer" onclick="createServer()">+</div>
</div>

<!-- CHANNELS -->
<div id="channels">
  <h3 id="serverName">No Server</h3>
  <div id="channelList"></div>
  <div id="addChannel" onclick="createChannel()">+ Add Channel</div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="chatHeader">Select a channel</div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

let currentServer = null;
let currentChannel = null;

// =========================
// LOAD SERVERS
// =========================
async function loadServers() {
  const res = await fetch(API + "/server/get", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ user })
  });

  const servers = await res.json();

  document.getElementById("serverList").innerHTML =
    servers.map(s =>
      `<div class="server" onclick="openServer('${s.name}')">${s.name[0].toUpperCase()}</div>`
    ).join("");
}

// =========================
// OPEN SERVER
// =========================
async function openServer(name) {
  currentServer = name;
  currentChannel = null;

  document.getElementById("serverName").textContent = name;

  const res = await fetch(API + "/channel/get", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ server: name })
  });

  const channels = await res.json();

  document.getElementById("channelList").innerHTML =
    channels.map(c =>
      `<div class="channel" onclick="openChannel('${c.name}')"># ${c.name}</div>`
    ).join("");
}

// =========================
// OPEN CHANNEL
// =========================
function openChannel(name) {
  currentChannel = name;
  document.getElementById("chatHeader").textContent = "#" + name;
  loadMessages();
}

// =========================
// SEND MESSAGE
// =========================
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text || !currentChannel) return;

  await fetch(API + "/channel/send", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      server: currentServer,
      channel: currentChannel,
      user,
      text
    })
  });

  input.value = "";
}

// =========================
// LOAD MESSAGES
// =========================
async function loadMessages() {
  if (!currentChannel) return;

  const res = await fetch(API + "/channel/getMessages", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      server: currentServer,
      channel: currentChannel
    })
  });

  const msgs = await res.json();

  const box = document.getElementById("messages");

  box.innerHTML =
    msgs.map(m =>
      `<p><b>${m.from}:</b> ${m.text}</p>`
    ).join("");

  box.scrollTop = box.scrollHeight;
}

// =========================
// CREATE SERVER
// =========================
async function createServer() {
  const name = prompt("Server name?");
  if (!name) return;

  await fetch(API + "/server/create", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ name, user })
  });

  loadServers();
}

// =========================
// CREATE CHANNEL
// =========================
async function createChannel() {
  if (!currentServer) return alert("Select a server first");

  const name = prompt("Channel name?");
  if (!name) return;

  await fetch(API + "/channel/create", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name,
      server: currentServer
    })
  });

  openServer(currentServer);
}

// =========================
// AUTO REFRESH
// =========================
setInterval(loadMessages, 2000);
loadServers();
</script>

</body>
</html>
