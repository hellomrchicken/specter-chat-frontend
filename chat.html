<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
}

#servers {
  width:80px;
  background:#111214;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.btn {
  width:55px;
  height:55px;
  background:#2b2d31;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.btn:hover { background:#5865f2; }

#channels {
  width:220px;
  background:#2b2d31;
  padding:10px;
  display:flex;
  flex-direction:column;
}

#searchUser {
  height:26px;
  font-size:11px;
  background:#1e1f22;
  color:white;
  border:none;
  border-radius:4px;
  padding:4px;
}

.item { padding:6px; cursor:pointer; }
.item:hover { background:#404249; }

#chat { flex:1; display:flex; flex-direction:column; }

#messages { flex:1; overflow-y:auto; padding:10px; }

#inputArea {
  display:flex;
  padding:10px;
  background:#2b2d31;
}

input {
  flex:1;
  padding:10px;
  background:#1e1f22;
  color:white;
  border:none;
}

button {
  margin-left:10px;
  background:#5865f2;
  color:white;
  border:none;
  padding:10px;
}
</style>
</head>

<body>

<div id="servers">
  <div class="btn" onclick="openDMs()">DM</div>
  <div class="btn" onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search..." oninput="filterUsers()">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

let currentDM=null, currentGroup=null, allUsers=[];

const msgBox = document.getElementById("msg");
const messages = document.getElementById("messages");

// ENTER TO SEND (FIXED PROPERLY)
msgBox.addEventListener("keydown", e=>{
  if(e.key==="Enter"){ e.preventDefault(); send(); }
});

// SECRET
function handleSecrets(t){
  return t.toLowerCase()==="!spyglass" ? "PARROT... I AM WIFES" : t;
}

// USERS
async function loadUsers(){
  const res=await fetch(API+"/users");
  const data=await res.json();
  allUsers=data.map(u=>u.username).filter(u=>u!==user);
  renderUsers(allUsers);
}

function renderUsers(list){
  panelList.innerHTML=list.map(u=>
    `<div class="item" onclick="openDM('${u}')">${u}</div>`
  ).join("");
}

function filterUsers(){
  renderUsers(allUsers.filter(u=>u.toLowerCase().includes(searchUser.value.toLowerCase())));
}

// DM
function openDM(u){ currentDM=u; currentGroup=null; }

// GROUP CREATE (WITH PASSWORD)
async function createGroup(){
  const name=prompt("Group name?");
  if(!name) return;

  const password=prompt("Password? (optional)");

  await fetch(API+"/group/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,user,password})
  });

  loadGroups();
}

// JOIN GROUP
async function openGroup(name){
  const password=prompt("Enter password if needed:");

  const res=await fetch(API+"/group/join",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,user,password})
  });

  const data=await res.json();
  if(data.error) return alert(data.error);

  currentGroup=name;
  currentDM=null;
}

// LOAD GROUPS
async function loadGroups(){
  const res=await fetch(API+"/group/get",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user})
  });

  const groups=await res.json();

  groupList.innerHTML=groups.map(g=>
    `<div class="btn" onclick="openGroup('${g.name}')">${g.name[0]}</div>`
  ).join("");
}

// SEND
async function send(){
  let text=handleSecrets(msgBox.value.trim());
  if(!text) return;

  if(currentDM){
    await fetch(API+"/dm/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({from:user,to:currentDM,text})
    });
  }

  if(currentGroup){
    await fetch(API+"/group/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({group:currentGroup,user,text})
    });
  }

  msgBox.value="";
}

// LOAD MESSAGES
async function loadMessages(){
  if(currentDM){
    const res=await fetch(API+"/dm/get",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:user})
    });
    const d=await res.json();

    messages.innerHTML=d
      .filter(m=>(m.from===user&&m.to===currentDM)||(m.from===currentDM&&m.to===user))
      .map(m=>`<p><b>${m.from}:</b> ${m.text}</p>`).join("");
  }

  if(currentGroup){
    const res=await fetch(API+"/group/getMessages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({group:currentGroup})
    });
    const g=await res.json();

    messages.innerHTML=g.map(m=>`<p><b>${m.from}:</b> ${m.text}</p>`).join("");
  }

  messages.scrollTop=messages.scrollHeight;
}

// INIT
setInterval(loadMessages,2000);
loadUsers();
loadGroups();
</script>

</body>
</html>
