<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

/* LEFT BAR */
#servers {
  width:80px;
  background:#0a0a0a;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.dmBtn {
  width:55px;
  height:55px;
  background:#222;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.dmBtn:hover {
  background:#444;
}

/* USERS PANEL */
#channels {
  width:220px;
  background:#1a1a1a;
  padding:10px;
  display:flex;
  flex-direction:column;
}

#searchUser {
  padding:8px;
  margin-bottom:10px;
  background:#111;
  color:white;
  border:none;
  border-radius:5px;
  outline:none;
}

.user {
  padding:6px;
  cursor:pointer;
  border-radius:5px;
}

.user:hover {
  background:#333;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#chatHeader {
  padding:10px;
  background:#1a1a1a;
  border-bottom:1px solid #333;
  font-size:14px;
  color:#bbb;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg {
  margin:5px 0;
}

.msg b {
  color:#4cafef;
}

/* INPUT */
#inputArea {
  display:flex;
  padding:10px;
  background:#222;
  gap:10px;
}

input {
  flex:1;
  padding:10px;
  border-radius:5px;
  border:none;
  background:#111;
  color:white;
  outline:none;
}

button {
  padding:10px 15px;
  background:#2ecc71;
  border:none;
  border-radius:5px;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#27ae60;
}
</style>
</head>

<body>

<!-- LEFT -->
<div id="servers">
  <div class="dmBtn" onclick="openDMList()">DM</div>
</div>

<!-- USERS -->
<div id="channels">
  <input id="searchUser" placeholder="Search users..." oninput="filterUsers()">
  <div id="panelList"></div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="chatHeader">Select a user</div>
  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

let allUsers = [];
let currentDM = null;

// ===================== USERS =====================
async function loadAllUsers() {
  const res = await fetch(API + "/users");
  const data = await res.json();

  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUsers(allUsers);
}

function renderUsers(list) {
  document.getElementById("panelList").innerHTML =
    list.map(u =>
      `<div class="user" onclick="openDM('${escapeHtml(u)}')">${escapeHtml(u)}</div>`
    ).join("");
}

function filterUsers() {
  const q = document.getElementById("searchUser").value.toLowerCase();
  renderUsers(allUsers.filter(u => u.toLowerCase().includes(q)));
}

// ===================== DM =====================
function openDM(u) {
  currentDM = u;
  document.getElementById("chatHeader").textContent = "DM with " + u;
  loadMessages();
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text || !currentDM) return;

  await fetch(API + "/dm/send", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      from:user,
      to:currentDM,
      text
    })
  });

  input.value = "";
}

// ===================== LOAD MESSAGES =====================
async function loadMessages() {
  if (!currentDM) return;

  const res = await fetch(API + "/dm/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ username:user })
  });

  const dms = await res.json();

  const filtered = dms.filter(m =>
    (m.from === user && m.to === currentDM) ||
    (m.from === currentDM && m.to === user)
  );

  const box = document.getElementById("messages");

  box.innerHTML = filtered.map(m =>
    `<div class="msg"><b>${escapeHtml(m.from)}:</b> ${escapeHtml(m.text)}</div>`
  ).join("");

  box.scrollTop = box.scrollHeight;
}

// ===================== OPEN DM LIST =====================
function openDMList() {
  currentDM = null;
  document.getElementById("chatHeader").textContent = "Direct Messages";
  loadAllUsers();
}

// ===================== SAFE TEXT =====================
function escapeHtml(str) {
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// ===================== INIT =====================
setInterval(loadMessages, 2000);
loadAllUsers();

</script>

</body>
</html>
