<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

#servers {
  width:80px;
  background:#0a0a0a;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.server, .dmBtn {
  width:55px;
  height:55px;
  background:#222;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

#channels {
  width:220px;
  background:#1a1a1a;
  padding:10px;
  display:flex;
  flex-direction:column;
}

#searchUser {
  padding:8px;
  margin-bottom:10px;
  background:#111;
  color:white;
  border:none;
  border-radius:5px;
}

.user, .channel {
  padding:6px;
  cursor:pointer;
}

#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#inputArea {
  display:flex;
  padding:10px;
  background:#222;
}
</style>
</head>

<body>

<div id="servers">
  <div class="dmBtn" onclick="openDMList()">DM</div>
  <div id="serverList"></div>
</div>

<div id="channels">
  <input id="searchUser" placeholder="Search users..." oninput="filterUsers()">
  <div id="panelList"></div>
</div>

<div id="chat">
  <div id="messages"></div>
  <div id="inputArea">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

let allUsers = [];
let currentDM = null;

async function loadAllUsers() {
  const res = await fetch(API + "/users");
  const data = await res.json();

  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUserList(allUsers);
}

function renderUserList(list) {
  document.getElementById("panelList").innerHTML =
    list.map(u => `<div class="user" onclick="openDM('${u}')">${u}</div>`).join("");
}

function filterUsers() {
  const q = document.getElementById("searchUser").value.toLowerCase();
  renderUserList(allUsers.filter(u => u.toLowerCase().includes(q)));
}

function openDM(u) {
  currentDM = u;
  loadMessages();
}

async function send() {
  const text = document.getElementById("msg").value;

  await fetch(API + "/dm/send", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ from:user, to:currentDM, text })
  });

  document.getElementById("msg").value = "";
}

async function loadMessages() {
  const res = await fetch(API + "/dm/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ username:user })
  });

  const dms = await res.json();

  const filtered = dms.filter(m =>
    (m.from === user && m.to === currentDM) ||
    (m.from === currentDM && m.to === user)
  );

  document.getElementById("messages").innerHTML =
    filtered.map(m => `<p><b>${m.from}:</b> ${m.text}</p>`).join("");
}

setInterval(loadMessages, 2000);
loadAllUsers();
</script>

</body>
</html>
