<!DOCTYPE html>
<html>
<head>
<title>Specter Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
}

/* LEFT BAR */
#servers {
  width:80px;
  background:#111214;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.btn {
  width:55px;
  height:55px;
  background:#2b2d31;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.btn:hover {
  background:#5865f2;
}

/* SIDE PANEL */
#channels {
  width:220px;
  background:#2b2d31;
  padding:10px;
  display:flex;
  flex-direction:column;
  border-right:1px solid #1e1f22;
}

#searchUser {
  width:100%;
  height:26px;
  padding:4px 8px;
  margin-bottom:10px;

  background:#1e1f22;
  color:white;

  border:none;
  border-radius:4px;

  font-size:11px;
  outline:none;
}

#searchUser:focus {
  box-shadow:0 0 0 1px #5865f2;
}

.item {
  padding:6px;
  cursor:pointer;
  border-radius:5px;
}

.item:hover {
  background:#404249;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#topBar {
  padding:10px;
  background:#2b2d31;
  border-bottom:1px solid #1e1f22;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#title {
  font-size:13px;
  color:#b5bac1;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#inputArea {
  display:flex;
  padding:10px;
  background:#2b2d31;
  border-top:1px solid #1e1f22;
}

input[type="text"] {
  flex:1;
  padding:10px;
  border:none;
  background:#1e1f22;
  color:white;
  border-radius:6px;
  outline:none;
}

button {
  margin-left:10px;
  padding:10px 15px;
  background:#5865f2;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#4752c4;
}
</style>
</head>

<body>

<!-- LEFT -->
<div id="servers">
  <div class="btn" onclick="openDMs()">DM</div>
  <div class="btn" onclick="createGroup()">+</div>
  <div id="groupList"></div>
</div>

<!-- USERS -->
<div id="channels">
  <input id="searchUser" placeholder="Search users..." oninput="filterUsers()">
  <div id="panelList"></div>
</div>

<!-- CHAT -->
<div id="chat">

  <div id="topBar">
    <div id="title">Select a chat</div>
    <button onclick="send()">Send</button>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="msg" type="text" placeholder="Message...">
  </div>

</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";
const user = localStorage.getItem("user");

if (!user) location.href = "index.html";

let allUsers = [];
let currentDM = null;
let currentGroup = null;

// ================= EASTER EGG =================
function spyglass(text) {
  if (text.trim() === "!spyglass") {
    return "PARROT... I AM WIFES";
  }
  return text;
}

// ================= ELEMENT FIX =================
const messages = document.getElementById("messages");
const title = document.getElementById("title");
const groupList = document.getElementById("groupList");

// ================= USERS =================
async function loadUsers() {
  const res = await fetch(API + "/users");
  const data = await res.json();

  allUsers = data.map(u => u.username).filter(u => u !== user);
  renderUsers(allUsers);
}

function renderUsers(list) {
  document.getElementById("panelList").innerHTML =
    list.map(u =>
      `<div class="item" onclick="openDM('${u}')">${u}</div>`
    ).join("");
}

function filterUsers() {
  const q = searchUser.value.toLowerCase();
  renderUsers(allUsers.filter(u => u.toLowerCase().includes(q)));
}

// ================= DM =================
function openDM(u) {
  currentDM = u;
  currentGroup = null;
  title.innerText = "DM: " + u;
  loadMessages();
}

function openDMs() {
  currentDM = null;
  currentGroup = null;
  title.innerText = "Direct Messages";
  loadUsers();
}

// ================= GROUPS =================
async function createGroup() {
  const name = prompt("Group name?");
  if (!name) return;

  await fetch(API + "/group/create", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, user })
  });

  loadGroups();
}

async function loadGroups() {
  const res = await fetch(API + "/group/get", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ user })
  });

  const groups = await res.json();

  groupList.innerHTML =
    groups.map(g =>
      `<div class="btn" onclick="openGroup('${g.name}')">${g.name[0]}</div>`
    ).join("");
}

function openGroup(name) {
  currentGroup = name;
  currentDM = null;
  title.innerText = "Group: " + name;
  loadMessages();
}

// ================= SEND =================
async function send() {
  const raw = msg.value.trim();
  if (!raw) return;

  const text = spyglass(raw);

  if (currentDM) {
    await fetch(API + "/dm/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ from:user, to:currentDM, text })
    });
  }

  if (currentGroup) {
    await fetch(API + "/group/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group:currentGroup, user, text })
    });
  }

  msg.value = "";
}

// ================= MESSAGES =================
async function loadMessages() {
  if (currentDM) {
    const res = await fetch(API + "/dm/get", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username:user })
    });

    const dms = await res.json();

    messages.innerHTML = dms
      .filter(m =>
        (m.from === user && m.to === currentDM) ||
        (m.from === currentDM && m.to === user)
      )
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }

  if (currentGroup) {
    const res = await fetch(API + "/group/getMessages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ group: currentGroup })
    });

    const msgs = await res.json();

    messages.innerHTML = msgs
      .map(m => `<p><b>${m.from}:</b> ${m.text}</p>`)
      .join("");
  }

  messages.scrollTop = messages.scrollHeight;
}

// ================= INIT =================
setInterval(loadMessages, 2000);
loadUsers();
loadGroups();
</script>

</body>
</html>
