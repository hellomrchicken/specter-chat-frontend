<!DOCTYPE html>
<html>
<head>
  <title>Specter Chat – Login</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #box {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      border: 2px solid #333;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      background: #4caf50;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #45a049;
    }

    #status {
      margin-top: 10px;
      min-height: 20px;
      color: #ff6666;
    }
  </style>
</head>
<body>

<div id="box">
  <h2>Specter Chat</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn" onclick="login()">Login</button>
  <button id="signupBtn" onclick="signup()">Sign Up</button>

  <p id="status"></p>
</div>

<script>
const API = "https://specter-chat-api.spectercat78.workers.dev";

let cooldown = false;

function setLoading(state, message = "") {
  document.getElementById("loginBtn").disabled = state;
  document.getElementById("signupBtn").disabled = state;
  document.getElementById("status").textContent = message;
}

function startCooldown() {
  cooldown = true;
  setTimeout(() => cooldown = false, 3000); // 3 sec anti-spam
}

async function login() {
  if (cooldown) return;

  const username = usernameInput();
  const password = passwordInput();

  if (!username || !password) {
    setLoading(false, "Enter username & password");
    return;
  }

  setLoading(true, "Please be patient...");

  try {
    const res = await fetch(API + "/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem("user", username);
      window.location = "chat.html";
    } else {
      setLoading(false, "Invalid login");
      startCooldown();
    }

  } catch {
    setLoading(false, "Network error");
    startCooldown();
  }
}

async function signup() {
  if (cooldown) return;

  const username = usernameInput();
  const password = passwordInput();

  if (!username || !password) {
    setLoading(false, "Enter username & password");
    return;
  }

  setLoading(true, "Please be patient... Do not spam Sign Up");

  try {
    const res = await fetch(API + "/signup", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      setLoading(false, "Account created! You can log in.");
    } else {
      setLoading(false, data.error || "Signup failed");
    }

    startCooldown();

  } catch {
    setLoading(false, "Network error");
    startCooldown();
  }
}

function usernameInput() {
  return document.getElementById("username").value.trim();
}

function passwordInput() {
  return document.getElementById("password").value.trim();
}
</script>

</body>
</html>
